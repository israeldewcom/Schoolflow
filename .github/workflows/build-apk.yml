name: Build SchoolFlow Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Bundle Bootstrap, icons and Chart.js for offline use
        run: bash scripts/vendor.sh

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SchoolFlow.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolflow-apk
          path: SchoolFlow.apk

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SchoolFlow build ${{ github.run_number }}
          files: SchoolFlow.apk
